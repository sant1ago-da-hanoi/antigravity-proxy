services:
  proxy:
    build: .
    ports:
      - "3000:3000"
    environment:
      - ACCOUNTS_FILE=/app/data/antigravity-accounts.json
      - BASE_URL=${BASE_URL:-http://127.0.0.1:3000}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
    volumes:
      - ./data:/app/data:z
    restart: unless-stopped
