<!DOCTYPE html>
<html lang="en" class="h-full antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity — Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/tailwind-config.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-zinc-50 dark:bg-black text-zinc-900 dark:text-zinc-200 h-full flex items-center justify-center transition-colors duration-300 font-mono selection:bg-emerald-500/30 selection:text-emerald-700 dark:selection:text-emerald-200">

    <div class="w-full max-w-sm mx-auto px-6">
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-2 mb-2">
                <div class="w-6 h-6 rounded bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center">
                    <svg class="w-3.5 h-3.5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                </div>
                <span class="text-sm font-bold tracking-tight">Antigravity</span>
            </div>
            <p class="text-[10px] text-zinc-500 dark:text-zinc-600 uppercase tracking-widest">Proxy Console</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div id="error-msg" class="hidden text-[11px] text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/20 border border-rose-200 dark:border-rose-900/40 rounded px-3 py-2 text-center"></div>

            <div>
                <label for="username" class="block text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-1.5">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" required
                    class="w-full px-3 py-2 text-xs bg-white dark:bg-[#0f0f0f] border border-zinc-200 dark:border-zinc-800 rounded focus:outline-none focus:border-emerald-500 dark:focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/20 transition-colors placeholder:text-zinc-400 dark:placeholder:text-zinc-700"
                    placeholder="admin">
            </div>

            <div>
                <label for="password" class="block text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-1.5">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required
                    class="w-full px-3 py-2 text-xs bg-white dark:bg-[#0f0f0f] border border-zinc-200 dark:border-zinc-800 rounded focus:outline-none focus:border-emerald-500 dark:focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500/20 transition-colors placeholder:text-zinc-400 dark:placeholder:text-zinc-700"
                    placeholder="password">
            </div>

            <button type="submit" id="submit-btn"
                class="w-full py-2 px-4 text-[11px] font-bold uppercase tracking-widest bg-emerald-500 hover:bg-emerald-600 text-white rounded transition-colors focus:outline-none focus:ring-2 focus:ring-emerald-500/50">
                Sign In
            </button>
        </form>

        <p class="text-center text-[9px] text-zinc-400 dark:text-zinc-700 mt-8">Credentials are set via PROXY_USERNAME and PROXY_PASSWORD env vars.</p>
    </div>

    <script>
        // Apply theme
        (function() {
            const pref = localStorage.theme || 'system';
            const isDark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.classList.toggle('dark', isDark);
        })();

        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (res.ok) {
                    const redirect = new URLSearchParams(window.location.search).get('redirect') || '/frontend/index.html';
                    window.location.href = redirect;
                } else {
                    const data = await res.json();
                    errorMsg.textContent = data.error?.message || 'Invalid credentials';
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Connection error. Is the proxy running?';
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });

        // Auto-focus username
        document.getElementById('username').focus();
    </script>
</body>
</html>
